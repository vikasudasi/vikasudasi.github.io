- date: 2026-07-31
  items:
    - title: "MCP 2026-07-28 Spec Released — Stateless Protocol Core"
      source: "MCP Blog"
      url: "https://blog.modelcontextprotocol.io/posts/2026-07-28"
      summary: "MCP transforms from bidirectional stateful to request/response stateless protocol; removes handshake/sessions, adds MRTR, header-based routing, cacheable list results, and formal extensions framework. SDKs cross 1B total downloads."
    - title: "Kimi K3 Open Weights Go Live — 2.8T Parameters, 1M Context"
      source: "ArXiv / News"
      url: "https://explainx.ai/blog/kimi-k3-open-weights-2-8-trillion-parameters-july-2026"
      summary: "Moonshot AI released Kimi K3 as the largest open-weight model ever (2.8T params, 1M context window), with day-0 hosting on Together AI and Modal, plus open-sourced infrastructure tools."
    - title: "GCC Steering Committee Adopts AI Contributions Policy"
      source: "Hacker News"
      url: "https://lwn.net/Articles/1086041/"
      summary: "GCC will decline legally significant LLM-generated contributions (~15+ lines), but allows LLMs for research, bug finding, and patch review — first major compiler to formalize boundaries on AI-authored code."
    - title: "Agent-Manager: Tmux TUI for Running Claude Code, Codex and OpenCode"
      source: "Hacker News"
      url: "https://github.com/YoanWai/agent-manager"
      summary: "New open-source Tmux terminal UI lets developers run, monitor, and switch between multiple coding agents side by side in the same terminal session."
    - title: "Open-Source Engine Runs Gemma 4 26B in 2GB RAM on Any M-Series Mac"
      source: "Hacker News"
      url: "https://github.com/drumih/turbo-fieldfare"
      summary: "Show HN project turbo-fieldfare achieves running Gemma 4 26B with only 2GB RAM on M-series Macs, dramatically lowering hardware requirements for local LLM inference."
    - title: "OmniRoute — Free MIT AI Gateway with 268+ Providers"
      source: "GitHub Trending"
      url: "https://github.com/diegosouzapw/OmniRoute"
      summary: "Open-source AI gateway offering 268+ providers (50+ free), 500+ models, quota-aware auto-fallback, MCP/A2A support, works with Claude Code, Codex, Cursor, OpenCode, and Copilot."
    - title: "Agentic Coding Agents Converge — Controls Become the Differentiator"
      source: "Web Research"
      url: "https://www.developersdigest.tech/blog/codex-claude-code-july-agent-controls"
      summary: "Claude Code 2.1.128, Codex iOS release, and OpenCode at 160K+ stars show the agentic coding race shifting from model capability to workflow controls, MCP integration, and plugin ecosystems."
    - title: "AI's Top Startups Are Barely Publishing Their Research"
      source: "Hacker News"
      url: "https://www.science.org/content/article/ai-s-top-startups-are-barely-publishing-their-research"
      summary: "Science magazine investigation finds leading AI startups sharply reducing research publications, sparking debate on open science vs competitive advantage in the AI industry."
    - title: "Microsoft MAI-Cyber-1-Flash — AI Model for Finding Security Flaws"
      source: "Agentic AI News"
      url: "https://agentic.ai/news"
      summary: "Microsoft launched its first AI model built to find security flaws in source code, paired with GPT-5.4 inside Project Perception, beating competing models on CyberGym benchmark."
    - title: "Cyabra Launches AI Agent That Investigates Coordinated Online Activity"
      source: "Agentic AI News"
      url: "https://agentic.ai/news"
      summary: "New AI agent automatically investigates coordinated online behavior and delivers a single evidence-backed verdict, moving agents into judgment-heavy trust and safety workflows."
