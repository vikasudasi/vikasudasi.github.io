- date: 2026-07-31
  items:
    - title: "MCP 2026-07-28 Spec Released — Stateless Protocol Core"
      source: "MCP Blog"
      url: "https://blog.modelcontextprotocol.io/posts/2026-07-28"
      summary: "MCP transforms from bidirectional stateful to request/response stateless protocol; removes handshake/sessions, adds MRTR, header-based routing, cacheable list results, and formal extensions framework. SDKs cross 1B total downloads."
    - title: "Kimi K3 Open Weights Go Live — 2.8T Parameters, 1M Context"
      source: "ArXiv / News"
      url: "https://explainx.ai/blog/kimi-k3-open-weights-2-8-trillion-parameters-july-2026"
      summary: "Moonshot AI released Kimi K3 as the largest open-weight model ever (2.8T params, 1M context window), with day-0 hosting on Together AI and Modal, plus open-sourced infrastructure including attention kernels and MoE comm library."
    - title: "GCC Steering Committee Adopts AI Contributions Policy"
      source: "Hacker News"
      url: "https://lwn.net/Articles/1086041/"
      summary: "GCC will decline legally significant LLM-generated contributions (~15+ lines), but allows LLMs for research, bug finding, and patch review — first major compiler to formalize boundaries on AI-authored code."
    - title: "Agent-Manager: Tmux TUI for Running Claude Code, Codex and OpenCode"
      source: "Hacker News"
      url: "https://github.com/YoanWai/agent-manager"
      summary: "New open-source Tmux terminal UI lets developers run, monitor, and switch between multiple coding agents side by side in the same terminal session."
    - title: "Open-Source Engine Runs Gemma 4 26B in 2GB RAM on Any M-Series Mac"
      source: "Hacker News"
      url: "https://github.com/drumih/turbo-fieldfare"
      summary: "Show HN project turbo-fieldfare achieves running Gemma 4 26B with only 2GB RAM on M-series Macs, dramatically lowering hardware requirements for local LLM inference."
    - title: "OmniRoute — Free MIT AI Gateway with 268+ Providers"
      source: "GitHub Trending"
      url: "https://github.com/diegosouzapw/OmniRoute"
      summary: "Open-source AI gateway offering 268+ providers (50+ free), 500+ models, quota-aware auto-fallback, MCP/A2A support, works with Claude Code, Codex, Cursor, OpenCode, and Copilot."
    - title: "Strix AI Pentest Tool Explodes — 19K+ Stars, Autonomous Security Agents"
      source: "GitHub Trending"
      url: "https://www.analyticsvidhya.com/blog/2026/07/trending-ai-github-repositories"
      summary: "Strix open-source AI penetration testing framework grows at ~7K stars/week, using autonomous agents that dynamically test apps and validate vulnerabilities with real proof-of-concept exploits."
    - title: "NVIDIA Declares Small Language Models the Future of Agentic AI"
      source: "NVIDIA Research"
      url: "https://research.nvidia.com/labs/lpr/slm-agents"
      summary: "NVIDIA position paper argues SLMs (under 10B params) are 10-30x cheaper and perform 50x better on specialized agentic tasks compared to large LLMs, recommending heterogeneous model architectures."
    - title: "Open-Weight Model Q3 2026 Projection — Frontier Parity by September"
      source: "Digital Applied"
      url: "https://www.digitalapplied.com/blog/open-weight-model-q3-2026-projection-competitive-forecast"
      summary: "Kimi K3 beats Claude Fable 5 on Frontend Code Arena. Analysis projects open-weight models reach parity on coding/math by Q3 end, with the gap narrowing on agentic evaluations."
    - title: "MCP Security Formal Framework Published on ArXiv"
      source: "ArXiv"
      url: "https://arxiv.org/abs/2604.05969"
      summary: "First formal security framework for MCP-based AI agents: threat taxonomy covering 12 attack vectors, formal verification models, and defense mechanisms as MCP reaches critical mass in the agent ecosystem."
    - title: "Agent Deck — Terminal Session Manager for AI Coding Agents"
      source: "GitHub"
      url: "https://github.com/asheshgoplani/agent-deck"
      summary: "Tmux-based TUI dashboard for managing multiple Claude Code, Gemini CLI, Aider, and Codex sessions with session forking, MCP socket pooling, and global search across conversations."
    - title: "AI's Top Startups Are Barely Publishing Their Research"
      source: "Hacker News"
      url: "https://www.science.org/content/article/ai-s-top-startups-are-barely-publishing-their-research"
      summary: "Science magazine investigation finds leading AI startups sharply reducing research publications, sparking debate on open science vs competitive advantage in the AI industry."
    - title: "Microsoft MAI-Cyber-1-Flash — AI Model for Finding Security Flaws"
      source: "Agentic AI News"
      url: "https://agentic.ai/news"
      summary: "Microsoft launched its first AI model built to find security flaws in source code, paired with GPT-5.4 inside Project Perception, beating competing models on CyberGym benchmark."
    - title: "i-have-adhd — ADHD-Friendly AI Coding Agent Skill Goes Viral (7.9K stars)"
      source: "GitHub Trending"
      url: "https://github.com/ayghri/i-have-adhd"
      summary: "Python skill for coding agents that formats output with ADHD-friendly structure — short, scannable, prioritized — going viral with 1,682 stars in a single day."
- date: 2026-07-27
  items:
    - title: "Kimi K3 Open Weights Ship on HuggingFace — 2.8T Parameters, Largest Open Model Ever"
      source: "Hacker News / X"
      url: "https://huggingface.co/moonshotai/Kimi-K3"
      summary: "Moonshot AI released Kimi K3 full open weights (2.8T params, 104B active, 1M context), with technical report on GitHub, open-sourced infrastructure (attention kernels, MoE comm library), and day-0 hosting on Together AI and Modal."
    - title: "Anthropic Publishes Position on Open-Weights Models"
      source: "Anthropic"
      url: "https://www.anthropic.com/news/position-open-weights-models"
      summary: "Anthropic released its official position on open-weights models, landing as the top HN story alongside Kimi K3's weight drop, as the industry debates the risks and benefits of releasing frontier-capable open models."
    - title: "Claude Opus 5 Released — New SOTA on Agentic Knowledge Work"
      source: "Anthropic"
      url: "https://www.anthropic.com/news/claude-opus-5"
      summary: "Anthropic launched Opus 5 as the biggest leap in the Opus family since 4.5, achieving new state-of-the-art on Frontier-Bench and GDPval-AA at half the price of Fable 5, with standout performance on full-stack app builds and 3D work."
    - title: "DeepSeek V4 Flash 0731 Retrain Beats V4-Pro-Preview on Agent Benchmarks"
      source: "Artificial Analysis"
      url: "https://artificialanalysis.ai/articles/deepseek-is-back-among-the-leading-open-weights-models-with-v4-pro-and-v4-flash"
      summary: "DeepSeek V4 Flash's 0731 post-train retrain beats V4-Pro-Preview on agent benchmarks at $0.14/$0.28 per million tokens, with the stable V4 Pro joining Kimi K2.6 as the top open-weight models on the Artificial Analysis Intelligence Index."
    - title: "Gemini Robotics 2 Brings Whole-Body Intelligence to Robots"
      source: "Hacker News"
      url: "https://deepmind.google"
      summary: "Google DeepMind announced Gemini Robotics 2, combining vision-language models with whole-body control, scoring 585+ points on Hacker News with 465 comments as embodied AI continues rapid advancement."
    - title: "GPT-5.6 Sol Proves the Cycle Double Cover Conjecture"
      source: "OpenAI"
      url: "https://cdn.openai.com/pdf/04d1d1e4-bc75-476a-97cf-49055cd98d31/cdc_proof.pdf"
      summary: "GPT-5.6 Sol Ultra produced a proof of the Cycle Double Cover Conjecture, a long-open graph theory problem, demonstrating frontier models' growing mathematical reasoning capability."
    - title: "Together AI Raises $800M Series C at $8.3B Valuation"
      source: "ThursdAI"
      url: "https://thursdai.news/releases/2026-07"
      summary: "Aramco Ventures led an $800M round for the open-model cloud provider, which reports over $1B in annual bookings and says open-model usage tripled year-over-year, with plans for 50x infrastructure growth over five years."
    - title: "Bun Rewritten from Zig to Rust by 64 Concurrent Claude Agents in 11 Days"
      source: "Hacker News"
      url: "https://lockwood.dev/ai/2026/07/27/how-is-the-bun-rewrite-in-rust-going.html"
      summary: "The Bun JavaScript runtime was ported from Zig to Rust by a fleet of 64 concurrent Claude agents, with the community tracking progress and discussing what the rewrite means for Bun's performance and maintainability."
    - title: "EU Orders Google to Open Android to Rival AI Assistants"
      source: "Build Fast With AI"
      url: "https://www.buildfastwithai.com/blogs/ai-news-today-july-20-2026-16-biggest-stories"
      summary: "European Commission adopted binding DMA requirements ordering Google to open Android to rival AI assistants by July 2027 and share search data with AI competitors from January 2027, the most consequential regulatory action in AI this year."
    - title: "Liquid AI Open-Sources Antidoom — Fixes Reasoning Model Doom-Loops"
      source: "ThursdAI / ArXiv"
      url: "https://thursdai.news/releases/2026-07"
      summary: "Liquid AI open-sourced Antidoom, a method that suppresses the failure mode where reasoning models spiral into repetitive degenerate output, cutting doom-loop rates from 22.9% to 1% on tested models while improving eval scores."
    - title: "Anthropic Discovers 'J-Space' — Global Workspace Inside Claude"
      source: "ThursdAI"
      url: "https://thursdai.news/releases/2026-07"
      summary: "Using a Jacobian-based interpretability technique, Anthropic identified a small internal subspace (~25 active concepts) in Claude that behaves like the global workspace from consciousness neuroscience, with J-lens open-sourced."
    - title: "Robostral Navigate — Mistral's First Embodied AI Model"
      source: "Hacker News"
      url: "https://thursdai.news/releases/2026-07"
      summary: "Mistral released an 8B robotics navigation model that guides robots via natural-language instructions using a single RGB camera, claiming state of the art on the R2R-CE benchmark."
