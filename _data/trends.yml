  items:
  - title: AI Cybersecurity Boom — Gemini 3.5 Flash Cyber, CodeMender, GPT5.6 finding WordPress RCEs
    source: Hacker News / Google
    url: https://news.ycombinator.com
    summary: Google drops Gemini 3.5 Flash Cyber (fine-tuned for vulnerability detection) paired with CodeMender multi-agent
      security system. GPT5.6 found WordPress RCEs with $25. Security defense AND offense accelerating.
  - title: Open-Weight Image Gen Hits Prime Time — Qwen-Image-3.0
    source: Hacker News (#1, 504 pts)
    url: https://news.ycombinator.com
    summary: 'Qwen-Image-3.0 lands at #1 on HN. Real text rendering, layout control, multilingual support — on par with DALL-E
      3, Apache 2.0 licensed. Open image gen (FLUX.2, SD 3.5, Qwen) now seriously competes with closed systems.'
  - title: Jack Dorsey's Buzz — open-source team chat + AI agents + Git hosting
    source: Hacker News (122 pts)
    url: https://news.ycombinator.com
    summary: 'Dorsey''s viral post: ''I''ve shifted from telling agents what to do, to asking them what to do.'' Kimi Work
      (630 HN pts) also launched. The entire dev workflow is being rethought around AI agents.'
- date: 2026-07-21
  items:
  - title: China's open-weights AI strategy is winning
    source: Hacker News (#1, 659 pts)
    url: https://news.ycombinator.com
    summary: Open-weight models (Qwen 3.8, Kimi K3) beating proprietary AI in global adoption — the open-weight model explosion
      is reshaping the industry.
  - title: Controlling Reasoning Effort in LLMs — the 'thinking budget' knob
    source: Hacker News / Research
    url: https://news.ycombinator.com
    summary: Sebastian Raschka on the new thinking budget parameter in modern reasoning models. Budget Guidance paper shows
      up to 26% accuracy gain under tight budgets.
  - title: Agent swarms and the new model economics
    source: Cursor Blog
    url: https://cursor.com
    summary: Multi-agent parallelism changing cost models — 5-15 agents working simultaneously, planner vs worker model separation.
  - title: Kimi K3, Qwen 3.8, and the open-weight pricing war
    source: Hacker News (#16, 216 pts)
    url: https://news.ycombinator.com
    summary: Open-weight models competing directly with closed-source flagships — 20+ viable models, GLM-5.2, DeepSeek V4,
      Kimi K2.6, Qwen3-Coder-Next, MiniMax M3 all rushing out.
  - title: Kimi Work — AI-powered work platform
    source: Hacker News (#2, 172 pts)
    url: https://news.ycombinator.com
    summary: Moonshot launches a scheduled AI productivity platform, signaling the shift to automated AI workflows on cron-like
      schedules.
  - title: Agent swarm economics — Cursor 3's parallel agent model changes cost math
    source: Hacker News
    url: https://news.ycombinator.com
    summary: Multiple AI agents running in parallel at 1,000 commits/sec. Cost modeling changes fundamentally with 5-15 agents
      working simultaneously. Planner vs worker model separation, new VCS for agents.
  - title: AI mathematicians — automated theorem disproof (Claude Fable, Jacobian Conjecture)
    source: Hacker News
    url: https://news.ycombinator.com
    summary: Claude Fable system found a counterexample to the Jacobian Conjecture, proving it false. This marks a new era
      of AI-assisted mathematical discovery and disproof.
  - title: arXiv slop crisis — 65% of CS papers now AI-written
    source: Hacker News / Research
    url: https://arxiv.org
    summary: Study estimates 65% of CS papers on arXiv contain AI-generated text. Growing demand for local, privacy-preserving
      detection tools that don't require uploading text to cloud services.
- date: 2026-07-20
  items:
  - title: GPT-5.6 closes 30-year complexity gap in convex optimization
    source: ArXiv
    url: https://arxiv.org
    summary: A UC Berkeley researcher used GPT-5.6 Sol Pro with a structured prompt to produce a formally verified Lean proof
      for a quadratic lower bound in zeroth-order optimization -- open since 1996.
  - title: Agent skills ecosystem hits 77K+ stars on GitHub
    source: GitHub Trending
    url: https://github.com/topics/agent-skills
    summary: The agent-skills repo by Addy Osmani gained 1,116 stars in a single day. Microsoft's SkillOpt paper shows skills
      can be auto-optimized for 2x accuracy.
  - title: Moonshine AI speech recognition runs on 80-cent microcontroller
    source: Hacker News
    url: https://news.ycombinator.com
    summary: 'Moonshine AI''s <500KB speech recognition + TTS model hit #3 on HN front page, running on an RP2350 microcontroller.'
  - title: Multi-model routing economy -- routing decision now worth more than model choice
    source: AI News
    url: https://venturebeat.com/ai
    summary: With 15+ viable models, the key optimization is routing the right task to the right model. Gemini Flash scores
      97% at $0.003/run on suitable tasks.
  - title: Harness Engineering > Prompt Engineering — agent runtime is now the bottleneck
    source: AI Engineer World's Fair / Latent Space
    url: https://www.latent.space
    summary: AI Engineering in 2026 runs on Harnesses, Not Prompts. Grok Build (xAI) open-sourced its coding agent CLI. The
      question is no longer 'can the model reason?' but 'what is the harness allowed to do between user turns?'
  - title: Open-weight models now carry majority of production AI traffic
    source: TechCrunch
    url: https://techcrunch.com
    summary: OpenRouter's top 5 models are all open-weight. Chinese open-weight models account for 41% of HuggingFace downloads.
      Kimi K3 dropped as the largest open model ever — yet no tool exists to test models on your own prompts.
  - title: Token cost crisis driving deterministic hybrid workflows
    source: ArXiv / Compiled AI paper
    url: https://arxiv.org/abs/2604.05150
    summary: The Compiled AI paper showed 57× token reduction by moving deterministic steps out of LLM calls. Developers need
      tools to profile their agent scripts and identify which LLM calls can be safely replaced.
